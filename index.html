<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12695b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Калькулятор"><title>Калькулятор цены</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head>
<body><header class="wrap"><div class="top"><strong data-i18n="title">Калькулятор цены</strong><div class="top-selects"><select id="currency" aria-label="Currency / Валюта / 货币"><option value="EUR">€ EUR</option><option value="RUB">₽ RUB</option><option value="CNY">¥ CNY</option></select><label class="language-label"><select id="language" aria-label="Language / Язык / 语言"><option value="ru">Русский</option><option value="en">English</option><option value="zh">中文</option></select></label></div></div><h1 data-i18n="tagline"></h1><p id="fx-line" class="fx-line"></p><div id="header-actions"><button id="view" class="quiet"></button><button id="theme" class="quiet"></button></div></header>
<main class="wrap"><p data-i18n="exampleNotice" class="panel"></p>
<div id="calculator">
<div class="head-grid"><section class="panel primary-panel"><label class="field"><span data-i18n="conditionMode"></span><select id="condition-mode"><option value="free" data-i18n="freeMode"></option><option value="annual" data-i18n="annualMode"></option><option value="markup" data-i18n="markupMode"></option></select></label><div id="primary-controls" class="fields primary-controls"></div><p id="edge-note" class="edge-note" role="status" hidden></p><div id="our-rate-fields" class="fields"></div><label class="field"><span data-i18n="volumePeriod"></span><select id="amount-basis"><option value="batch" data-i18n="batch"></option><option value="annual" data-i18n="annualVolumeKg"></option></select></label><div id="batch-fields" class="fields"></div><label class="field"><span data-i18n="unitSize"></span><select id="unit-size"><option value="1" data-i18n="unitKg"></option><option value="100" data-i18n="unit100"></option><option value="1000" data-i18n="unitTon"></option></select></label><p id="terms-brief" class="terms-brief" aria-live="polite"></p></section><section class="panel header-cycle" id="header-cycle"><div class="cycle-heading"><h2 data-i18n="financialCycle"></h2><strong id="cycle-label" aria-live="polite"></strong></div><div id="cycle-fields" class="cycle-fields"></div><p id="operating-total" class="cycle-total" aria-live="polite"></p><div class="cycle" aria-live="polite"><span data-i18n="fundingFormula"></span><strong id="cycle-equation"></strong></div><svg id="cycle-diagram" viewBox="0 0 600 108" role="img" aria-label="Financial cycle"></svg></section></div>
<section class="decision-summary excel-summary" id="decision-summary" aria-live="polite"><h2 data-i18n="kgTitle"></h2><strong id="kg-result" class="kg-result"></strong><div class="decision-line"><strong id="decision"></strong><span id="summary-rate"></span><span id="comparison"></span></div><h3 id="split-title"></h3><div class="ledgers" id="kg-results"></div><div class="cash-block" id="cash-block"><h3 id="cash-title"></h3><div class="metrics" id="cash-results"></div><p id="cash-when" class="cash-when"></p><p id="cash-day" class="cash-day"></p><div class="cash-target"><h4 data-i18n="cashTargetTitle"></h4><div id="cash-target-field" class="cash-target-field"></div><div class="metrics" id="cash-target-results"></div></div></div><h3 id="effect-title"></h3><div class="effect-strip" id="deferral-effect"></div></section>
<p id="invalid" class="error" role="alert"></p>
<details class="panel" id="curve-details"><summary data-i18n="chart"></summary><svg id="chart" viewBox="0 0 600 220" role="img" aria-label="Price by supplier term"></svg></details>
<details class="panel arguments"><summary data-i18n="argsTitle"></summary><div id="args-body"></div><details><summary data-i18n="chinaRate"></summary><div id="benchmark-fields" class="fields"></div></details></details>
</div>
<section id="supplier-screen" hidden><h2 data-i18n="supplierTitle"></h2><p data-i18n="supplierNote" class="muted"></p><div class="panel supplier-summary"><strong id="supplier-headline" class="supplier-headline"></strong><p id="supplier-terms" class="terms-brief"></p></div><div class="panel table-scroll" id="supplier-values" aria-live="polite"></div><section class="panel arguments"><h2 data-i18n="argsTitle"></h2><div id="supplier-args-body"></div></section></section>
<footer><p data-i18n="localOnly"></p><p id="legacy"></p><p id="offline"></p><p id="storage" class="error"></p><p id="install"></p></footer></main><div id="mobile-dock" class="mobile-dock"><div><span data-i18n="kgAfter"></span><strong id="dock-result"></strong></div><div><span data-i18n="kgDifference"></span><strong id="dock-ceiling"></strong></div></div><script type="module" src="./app.js"></script></body></html>
